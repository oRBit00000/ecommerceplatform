services:
  postgres:
    image: postgres:17
    container_name: ecommerce-platform-db
    environment:
      POSTGRES_DB: ecommerce_platform
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
