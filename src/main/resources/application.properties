spring.application.name=ECommercePlatform

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce_platform}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ecommerce}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ecommerce}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}

spring.thymeleaf.cache=false

jwt.secret=${JWT_SECRET:change-this-jwt-secret-in-local-env-2026-very-long-value}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:20m}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:7d}

paypal.base-url=${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
paypal.currency=${PAYPAL_CURRENCY:EUR}
