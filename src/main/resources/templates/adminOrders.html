<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>All Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <div class="text-uppercase small text-primary fw-semibold mb-2">Admin</div>
            <h1 class="h3 mb-1">All Customer Orders</h1>
            <p class="text-secondary mb-0">Filter the full purchase history by customer name and date range.</p>
        </div>
        <a class="btn btn-outline-primary" th:href="@{/mvc/admin/dashboard}">Back to Dashboard</a>
    </div>

    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <form class="row g-3" th:action="@{/mvc/orders/admin}" th:object="${orderSearchForm}" method="post">
                <div class="col-md-4">
                    <label class="form-label" for="customerUsername">Customer</label>
                    <input class="form-control" id="customerUsername" th:field="*{customerUsername}" placeholder="Search customer">
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="dateFrom">From</label>
                    <input class="form-control" id="dateFrom" th:field="*{dateFrom}" type="date">
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="dateTo">To</label>
                    <input class="form-control" id="dateTo" th:field="*{dateTo}" type="date">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button class="btn btn-primary w-100" type="submit">Search</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card border-0 shadow-sm mb-3" th:each="order : ${orders}">
        <div class="card-body">
            <div class="d-flex justify-content-between flex-wrap gap-2 mb-3">
                <div>
                    <h2 class="h5 mb-1 text-dark" th:text="${order.customerUsername}">Customer order</h2>
                    <div class="text-secondary small" th:text="${order.createdAt}"></div>
                </div>
                <div class="text-end">
                    <div class="badge text-bg-primary mb-1" th:text="${order.paymentMethod}"></div>
                    <div class="fw-semibold" th:text="${#numbers.formatDecimal(order.totalAmount,1,2)} + ' EUR'"></div>
                </div>
            </div>
            <div class="border-top pt-3">
                <div class="small text-uppercase text-secondary fw-semibold mb-2">Purchased items</div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item px-0 py-2" th:each="item : ${order.items}">
                        <div class="d-flex justify-content-between gap-2">
                            <span th:text="${item.productName} + ' x ' + ${item.quantity}">Item</span>
                            <strong th:text="${#numbers.formatDecimal(item.totalPrice,1,2)} + ' EUR'">0.00 EUR</strong>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</main>
</body>
</html>
