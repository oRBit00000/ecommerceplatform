<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shopping Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="/js/auth.js"></script>
    <script>
        function setCartMessage(message, isError = false) {
            const alert = document.getElementById('cartMessage');
            alert.className = `alert ${isError ? 'alert-danger' : 'alert-success'}`;
            alert.innerText = message;
            alert.classList.remove('d-none');
        }

        async function refreshCart() {
            const response = await AuthClient.sessionAwareFetch('/rest/cart/summary', { allowAnonymous: true });
            const data = await response.json();
            document.getElementById('summaryItems').innerText = data.totalItems;
            document.getElementById('summaryPrice').innerText = `${Number(data.totalPrice ?? 0).toFixed(2)} EUR`;

            const tbody = document.getElementById('cartTableBody');
            tbody.innerHTML = '';
            if (!data.items || data.items.length === 0) {
                document.getElementById('emptyState').classList.remove('d-none');
                document.getElementById('cartTableWrapper').classList.add('d-none');
                return;
            }

            document.getElementById('emptyState').classList.add('d-none');
            document.getElementById('cartTableWrapper').classList.remove('d-none');

            data.items.forEach(item => {
                tbody.insertAdjacentHTML('beforeend', `
                    <tr>
                        <td class="fw-semibold">${item.productName}</td>
                        <td>${Number(item.unitPrice).toFixed(2)} EUR</td>
                        <td>
                            <div class="d-flex gap-2">
                                <input class="form-control" id="qty-${item.productId}" type="number" value="${item.quantity}" min="0" max="${item.availableStock}">
                                <button class="btn btn-outline-primary btn-sm" type="button" onclick="updateCart(${item.productId})">Save</button>
                            </div>
                            <div class="small text-secondary mt-1">Available: ${item.availableStock}</div>
                        </td>
                        <td class="fw-semibold">${Number(item.totalPrice).toFixed(2)} EUR</td>
                        <td class="text-end">
                            <button class="btn btn-outline-danger btn-sm" type="button" onclick="removeFromCart(${item.productId})">Remove</button>
                        </td>
                    </tr>
                `);
            });
        }

        async function updateCart(productId) {
            const quantity = document.getElementById(`qty-${productId}`).value;
            const response = await AuthClient.sessionAwareFetch(`/rest/cart/update?productId=${productId}&quantity=${quantity}`, {
                method: 'POST',
                allowAnonymous: true
            });
            if (!response.ok) {
                const error = await response.json();
                setCartMessage(error.message || 'Unable to update cart quantity.', true);
                return;
            }
            refreshCart();
        }

        async function removeFromCart(productId) {
            await AuthClient.sessionAwareFetch(`/rest/cart/remove?productId=${productId}`, {
                method: 'POST',
                allowAnonymous: true
            });
            refreshCart();
        }

        async function clearCartAjax() {
            await AuthClient.sessionAwareFetch('/rest/cart/clear', {
                method: 'POST',
                allowAnonymous: true
            });
            refreshCart();
        }

        globalThis.addEventListener('load', refreshCart);
        document.addEventListener('DOMContentLoaded', () => AuthClient.startAutoRefresh());
    </script>
</head>
<body class="bg-body-tertiary">
<nav class="navbar shadow-sm" style="background-color:#f7efe5;">
    <div class="container">
        <a class="navbar-brand fw-semibold text-primary" th:href="@{/mvc/products/search}">ECommercePlatform</a>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-primary btn-sm" th:href="@{/login}" sec:authorize="isAnonymous()">Login</a>
            <a class="btn btn-primary btn-sm" th:href="@{/register}" sec:authorize="isAnonymous()">Register</a>
            <a class="btn btn-outline-primary btn-sm" th:href="@{/mvc/products/search}">Continue Shopping</a>
            <a class="btn btn-primary btn-sm" th:href="@{/mvc/orders/checkout}">Checkout</a>
            <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
                <button class="btn btn-outline-primary btn-sm" type="submit">Logout</button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white border-0 pt-4">
                    <h1 class="h3 mb-0">Your Shopping Cart</h1>
                </div>
                <div class="card-body">
                    <div id="cartMessage" class="alert alert-danger d-none"></div>
                    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
                    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
                    <div id="emptyState" th:classappend="${#lists.isEmpty(cartSummary.items)} ? '' : ' d-none'" class="alert alert-secondary mb-0">
                        Your cart is empty. Add some products from the catalog.
                    </div>
                    <div class="table-responsive" id="cartTableWrapper" th:classappend="${#lists.isEmpty(cartSummary.items)} ? ' d-none' : ''">
                        <table class="table align-middle">
                            <thead>
                            <tr>
                                <th>Product</th>
                                <th>Unit price</th>
                                <th style="width: 180px;">Quantity</th>
                                <th>Total</th>
                                <th></th>
                            </tr>
                            </thead>
                            <tbody id="cartTableBody">
                            <tr th:each="item : ${cartSummary.items}">
                                <td class="fw-semibold" th:text="${item.productName}"></td>
                                <td th:text="${#numbers.formatDecimal(item.unitPrice,1,2)} + ' EUR'"></td>
                                <td>
                                    <form class="d-flex gap-2" th:action="@{/mvc/cart/update}" method="post">
                                        <input type="hidden" name="productId" th:value="${item.productId}">
                                        <input class="form-control" type="number" name="quantity" th:value="${item.quantity}" min="0" th:max="${item.availableStock}">
                                        <button class="btn btn-outline-primary btn-sm" type="submit">Save</button>
                                    </form>
                                    <div class="small text-secondary mt-1">Available: <span th:text="${item.availableStock}"></span></div>
                                </td>
                                <td class="fw-semibold" th:text="${#numbers.formatDecimal(item.totalPrice,1,2)} + ' EUR'"></td>
                                <td class="text-end">
                                    <form th:action="@{/mvc/cart/remove}" method="post">
                                        <input type="hidden" name="productId" th:value="${item.productId}">
                                        <button class="btn btn-outline-danger btn-sm" type="submit">Remove</button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <h2 class="h5 mb-3">Order Summary</h2>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-secondary">Items</span>
                        <strong id="summaryItems" th:text="${cartSummary.totalItems}"></strong>
                    </div>
                    <div class="d-flex justify-content-between mb-4">
                        <span class="text-secondary">Total</span>
                        <strong class="fs-5" id="summaryPrice" th:text="${#numbers.formatDecimal(cartSummary.totalPrice,1,2)} + ' EUR'"></strong>
                    </div>
                    <div class="d-grid gap-2">
                        <a class="btn btn-primary" th:href="@{/mvc/orders/checkout}">Proceed to Checkout</a>
                        <button class="btn btn-outline-secondary w-100" type="button" onclick="clearCartAjax()">Clear Cart</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
