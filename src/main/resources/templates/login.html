<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body style="background-color:#f8f5f0;">
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <h1 class="h3 mb-1">Sign in</h1>
                        <p class="text-secondary mb-0">Use your customer or admin account to continue.</p>
                    </div>

                    <div th:if="${param.error}" class="alert alert-danger">Invalid username or password.</div>
                    <div th:if="${param.expired}" class="alert alert-warning">Session expired. Please log in again.</div>
                    <div th:if="${param.logout}" class="alert alert-success">You have been signed out successfully.</div>
                    <div th:if="${param.registered}" class="alert alert-success">Registration complete. You can log in now.</div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="username">Username</label>
                            <input class="form-control" id="username" name="username" type="text" placeholder="Enter your username" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="password">Password</label>
                            <input class="form-control" id="password" name="password" type="password" placeholder="Enter your password" required>
                        </div>
                        <div class="d-grid gap-2">
                            <button class="btn btn-primary" type="submit">Log In</button>
                            <a class="btn btn-outline-primary" th:href="@{/register}">Create Customer Account</a>
                            <a class="btn btn-link text-decoration-none" th:href="@{/mvc/products/search}">Back to Storefront</a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
