<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div>
                            <div class="text-uppercase small text-primary fw-semibold mb-2">Admin</div>
                            <h1 class="h3 mb-1" th:text="${productDTO.id == null} ? 'Add Product' : 'Edit Product'">Product form</h1>
                            <p class="text-secondary mb-0">Manage product details, category, price, and stock.</p>
                        </div>
                        <a class="btn btn-outline-primary" th:href="@{/mvc/admin/dashboard}">Back</a>
                    </div>
                    <form th:action="@{/mvc/products/new}" th:object="${productDTO}" method="post">
                        <input type="hidden" th:field="*{id}">
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label" for="name">Name</label>
                                <input class="form-control" id="name" th:field="*{name}" type="text">
                                <div class="text-danger small" th:errors="*{name}"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="categoryId">Category</label>
                                <select class="form-select" id="categoryId" th:field="*{categoryId}">
                                    <option value="">Choose category</option>
                                    <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option>
                                </select>
                                <div class="text-danger small" th:errors="*{categoryId}"></div>
                            </div>
                            <div class="col-12">
                                <label class="form-label" for="description">Description</label>
                                <textarea class="form-control" id="description" rows="4" th:field="*{description}"></textarea>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="price">Price</label>
                                <input class="form-control" id="price" th:field="*{price}" type="number" step="0.01">
                                <div class="text-danger small" th:errors="*{price}"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="stockQuantity">Stock quantity</label>
                                <input class="form-control" id="stockQuantity" th:field="*{stockQuantity}" type="number">
                                <div class="text-danger small" th:errors="*{stockQuantity}"></div>
                            </div>
                        </div>
                        <div class="mt-4">
                            <button class="btn btn-primary" type="submit">Save Product</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
