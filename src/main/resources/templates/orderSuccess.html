<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Order Success</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm text-center">
                <div class="card-body p-5">
                    <div class="badge text-bg-success mb-3">Order Confirmed</div>
                    <h1 class="h3 mb-3 text-dark">Your order has been placed</h1>
                    <p class="text-secondary mb-1">Order number: <strong th:text="${order.id}"></strong></p>
                    <p class="text-secondary mb-1">Payment method: <strong th:text="${order.paymentMethod}"></strong></p>
                    <p class="text-secondary">Total: <strong th:text="${#numbers.formatDecimal(order.totalAmount,1,2)} + ' EUR'"></strong></p>
                    <div class="d-flex justify-content-center gap-2 mt-4">
                        <a class="btn btn-primary" th:href="@{/mvc/orders/history}">View History</a>
                        <a class="btn btn-outline-primary" th:href="@{/mvc/products/search}">Continue Shopping</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
