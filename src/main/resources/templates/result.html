<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Saved</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm text-center">
                <div class="card-body p-5">
                    <div class="badge text-bg-primary-subtle text-primary mb-3">Saved</div>
                    <div class="display-6 mb-3 text-dark">Product Saved</div>
                    <p class="lead text-secondary" th:text="${productDTO.name + ' in ' + productDTO.categoryName}"></p>
                    <a class="btn btn-primary mt-3" th:href="@{/mvc/admin/dashboard}">Back to Dashboard</a>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
