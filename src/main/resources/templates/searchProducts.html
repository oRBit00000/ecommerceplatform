<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="/js/auth.js"></script>
    <script>
        function showCartToast(message, isError = false) {
            const toastEl = document.getElementById('cartToast');
            toastEl.querySelector('.toast-body').innerText = message;
            toastEl.classList.toggle('text-bg-primary', !isError);
            toastEl.classList.toggle('text-bg-danger', isError);
            bootstrap.Toast.getOrCreateInstance(toastEl).show();
        }
        async function refreshCartBadge() {
            const response = await AuthClient.sessionAwareFetch('/rest/cart/summary', { allowAnonymous: true });
            const data = await response.json();
            document.getElementById('cartBadge').innerText = data.totalItems;
        }
        async function addToCart(productId, quantityInputId) {
            const quantity = document.getElementById(quantityInputId).value;
            const response = await AuthClient.sessionAwareFetch(`/rest/cart/add?productId=${productId}&quantity=${quantity}`, {
                method: 'POST',
                allowAnonymous: true
            });
            if (!response.ok) {
                const error = await response.json();
                showCartToast(error.message || 'Unable to add product to cart.', true);
                return;
            }
            const data = await response.json();
            document.getElementById('cartBadge').innerText = data.totalItems;
            showCartToast('Product added to cart.');
        }
        globalThis.addEventListener('load', refreshCartBadge);
        setInterval(refreshCartBadge, 5000);
        document.addEventListener('DOMContentLoaded', () => AuthClient.startAutoRefresh());
    </script>
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-expand-lg" style="background-color:#f7efe5;">
    <div class="container">
        <a class="navbar-brand fw-semibold text-primary" th:href="@{/mvc/products/search}">ECommercePlatform</a>
        <div class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
            <a class="nav-link active text-primary fw-semibold" th:href="@{/mvc/products/search}">Catalog</a>
            <a class="nav-link text-dark" th:href="@{/mvc/cart}">Cart <span class="badge text-bg-primary ms-1" id="cartBadge">0</span></a>
            <a class="nav-link text-dark" th:href="@{/mvc/orders/history}" sec:authorize="isAuthenticated()">My Orders</a>
            <a class="nav-link text-dark" th:href="@{/mvc/admin/dashboard}" sec:authorize="hasRole('ADMIN')">Admin</a>
            <a class="btn btn-outline-primary btn-sm ms-lg-2" th:href="@{/login}" sec:authorize="isAnonymous()">Login</a>
            <a class="btn btn-primary btn-sm" th:href="@{/register}" sec:authorize="isAnonymous()">Register</a>
            <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
                <button class="btn btn-outline-primary btn-sm ms-lg-2" type="submit">Logout</button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="p-4 p-md-5 mb-4 rounded-4 shadow-sm" style="background:linear-gradient(135deg,#fff7ed,#eef6ff);">
        <div class="col-lg-8">
            <div class="text-uppercase small text-primary fw-semibold mb-2">Ecommerce platform</div>
            <h1 class="display-6 fw-bold text-dark">Available products</h1>
            <p class="lead mb-0 text-secondary">Easy filtering</p>
        </div>
    </div>

    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <form class="row g-3" th:action="@{/mvc/products/search}" th:object="${productSearchForm}" method="post">
                <div class="col-md-4">
                    <label class="form-label" for="name">Product name</label>
                    <input class="form-control" id="name" th:field="*{name}" placeholder="Search by name">
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="category">Category</label>
                    <select class="form-select" id="category" th:field="*{category}">
                        <option value="">All categories</option>
                        <option th:each="category : ${productCategoriesList}" th:value="${category}" th:text="${category}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="priceFrom">Price from</label>
                    <input class="form-control" id="priceFrom" th:field="*{priceFrom}" type="number" step="0.01" placeholder="0">
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="priceTo">Price to</label>
                    <input class="form-control" id="priceTo" th:field="*{priceTo}" type="number" step="0.01" placeholder="999">
                </div>
                <div class="col-12 d-flex gap-2">
                    <button class="btn btn-primary" type="submit">Filter Products</button>
                    <a class="btn btn-outline-secondary" th:href="@{/mvc/products/search}">Reset</a>
                </div>
            </form>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-6 col-xl-4" th:each="product : ${productDTOList}">
            <div class="card h-100 border-0 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <div class="mb-3">
                        <div>
                            <div class="badge text-bg-light border mb-2" th:text="${product.categoryName}"></div>
                            <h5 class="card-title mb-1" th:text="${product.name}">Product name</h5>
                        </div>
                    </div>
                    <p class="card-text text-secondary flex-grow-1" th:text="${product.description}"></p>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div>
                            <div class="fw-bold fs-5" th:text="${#numbers.formatDecimal(product.price,1,2)} + ' EUR'"></div>
                            <small class="text-secondary">In stock: <span th:text="${product.stockQuantity}"></span></small>
                        </div>
                    </div>
                    <form class="row g-2 mt-auto" th:action="@{/mvc/cart/add}" method="post">
                        <div class="col-4">
                            <input class="form-control" type="number" th:id="${'qty-' + product.id}" value="1" min="1" th:max="${product.stockQuantity}">
                        </div>
                        <div class="col-8">
                            <button class="btn btn-primary w-100" type="button" th:attr="onclick=|addToCart(${product.id}, 'qty-${product.id}')|">Add to Cart</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
    <div id="cartToast" class="toast align-items-center text-bg-primary border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body">Product added to cart.</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
